# This workflow will build a .NET project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-net

name: Build MAUI Android App

on:
  workflow_dispatch:
    inputs: 
      build_config:
        description: 'How to build'
        required: true
        type: choice
        options: [Release, Debug]
        default: 'Release'
      play_track:
        description: 'Google Play Track'
        type: choice
        options: [internal, alpha, beta, production]
        default: internal
      play_status:
        description: 'Google Play Status'
        type: choice
        options: [completed, draft]
        default: draft

jobs:
  build:
    env:
      BUILD_CONFIG: ${{ github.event.inputs.build_config }}
      PACKAGE_NAME: 'com.companyname.chd.poomsae.scoring.app'
      
    runs-on: windows-latest

    strategy:
      matrix:
        dotnet-version: [ '11.0.x' ]

    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 11.0.x
        
    - name: Install Maui
      run: dotnet workload install maui 
        
    - name: Restore dependencies
      run: dotnet restore
    - name: Publish
      run: |
        $MAJOR=2
        $MINOR=1
        $YEAR=& Get-Date -UFormat "%y%j"
        $HOUR=& Get-Date -format HHmm
        $VERSION="$MAJOR.$MINOR.$YEAR.$HOUR"
        echo "DATEVERSION=$VERSION" >> $env:GITHUB_ENV
        dotnet publish src/chd.Poomsae.Scoring.App/chd.Poomsae.Scoring.App.csproj --no-restore --configuration ${{ env.BUILD_CONFIG }} --framework net11.0-android /p:ApplicationDisplayVersion=$VERSION /p:ApplicationVersion=${{ github.run_number}} /p:AndroidSigningKeyPass=${{secrets.CHDPOOMSAE_SCORING_KEYPASS}} /p:AndroidSigningStorePass=${{secrets.CHDPOOMSAE_SCORING_KEYPASS}} /p:AndroidKeyStore=true /p:AndroidSigningKeyStore=chdpoomsaescoring.keystore /p:AndroidSigningKeyAlias=chdpoomsaescoring /p:AndroidSigningKeyAlias=chdpoomsaescoring /p:AndroidVersionCode=${{github.run_number}} /p:PublishReadyToRun=false 
        
    - name: Collect files
      shell: pwsh
      run: |
        New-Item -ItemType Directory -Force release | Out-Null
        $aab = Get-ChildItem -Recurse src -Filter *-Signed.aab | Where-Object { $_.FullName -match 'publish' } | Select-Object -First 1
        Copy-Item $aab.FullName "release/scoPom${{ env.VERSION }}.aab"
        $apk = Get-ChildItem -Recurse src -Filter *.apk | Where-Object { $_.FullName -match 'publish' } | Select-Object -First 1
        Copy-Item $apk.FullName "release/scoPom-${{ env.VERSION }}.apk"

    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: scoPoom-${{ env.VERSION }}
        path: release/*
        
    - name: Create Tag and Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v${{ env.VERSION }}
        target_commitish: ${{ github.sha }}
        name: chd ScoringPoomsae ${{ env.VERSION }}
        files: release/*.exe
        generate_release_notes: true
        prerelease: ${{ env.BUILD_CONFIG == 'Debug' }}
        make_latest: ${{ env.BUILD_CONFIG == 'Release' }}

    - name: Upload to Google Play
      if: ${{ inputs.build_config == 'Release' }}
      uses: r0adkll/upload-google-play@v1
      with:
        serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        packageName: ${{ env.PACKAGE_NAME }}
        releaseFiles: release/*.aab
        track: ${{ inputs.play_track }}
        status:  ${{ inputs.play_status }} # "completed"   "draft", falls die App in Play noch im Entwurfsstatus ist
        changesNotSentForReview: true
